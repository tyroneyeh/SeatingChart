    <h1>TY 座位表 - 真心推薦的線上免費排座位工具</h1>
    <p>歡迎使用 TY Seating Chart。這是一款專為老師、班級幹部設計的<b>線上座位表工具</b>，比 Word、Excel 更輕鬆，旨在解決換座位、排座位的煩惱。透過這個<b>座位表</b>，您可以輕鬆完成<b>隨機排座位</b>與配置調整。</p>
    <h2>核心功能介紹：</h2>
    <ul>
      <li><b>線上座位表：</b>免下載、免安裝，開啟網域即可使用，電腦手機皆可操作。</li>
      <li><b>隨機排座位：</b>內建演算法一鍵自動排列學生名單，公平、透明、快速。</li>
      <li><b>學生名單快速匯入：</b>支援直接貼上名單，不用一個一個手打，省下大量行政時間。</li>
      <li><b>自定義教室配置：</b>靈活調整欄位與排數，適應各種規模的教室大小。</li>
      <li><b>一鍵列印與匯出：</b>排好後支援直接列印，方便老師將座位表張貼於班級佈告欄。</li>
      <li><b>開源專案：</b>本工具為開放原始碼專案，安全且持續維護。</li>

    <p>這是一個由開發者獨立維護的 Side Project ，致力於提供最簡便、有效率且完全免費的線上排座位工具。</p>
    <h1>TY Seating Chart - A Highly Recommended Free Online Seating Tool</h1>
    <p>Welcome to TY Seating Chart. This is an online seating chart tool designed specifically for teachers and class leaders. It's easier than Word or Excel, aiming to solve the hassle of changing and arranging seats. Through this seating chart generator, you can easily complete random seating arrangements and configuration adjustments.</p>
    <h2>Core Features:</h2>
    <ul>
      <li><b>Online Seating Chart:</b> No download or installation required. Simply open your domain to use it. It can be operated on both computers and mobile phones.</li>
      <li><b>Random Seating Arrangement:</b> Built-in algorithm automatically arranges student lists with one click, ensuring fairness, transparency, and speed.</li>
      <li><b>Quick Import of Student Lists:</b> Supports directly pasting lists, eliminating the need for manual typing and saving significant administrative time.</li>
      <li><b>Customizable Classroom Configuration:</b> Flexible adjustment of rows and columns to adapt to classrooms of various sizes.</li>
      <li><b>One-Click Printing and Export:</b> Supports direct printing after arrangement, making it convenient for teachers to post the seating chart on the classroom bulletin board.</li>
